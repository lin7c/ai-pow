name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standalone tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Check package installation
        run: |
          python -m pip install .
          aipow --version

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the demo is generated from this repository's own commits.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Generate demo with the production algorithm
        run: python scripts/build_demo.py
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/aipow-browser" --no-save --package-lock=false playwright@1.59.1
          "$RUNNER_TEMP/aipow-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check offline report interactions and responsive layout
        env:
          NODE_PATH: ${{ runner.temp }}/aipow-browser/node_modules
        run: node scripts/test_report_browser.cjs
