[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-pow"
version = "0.5.0"
description = "Local, bounded AI work provenance bound to Git commits"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["ai", "agents", "git", "provenance", "observability"]

[project.urls]
Homepage = "https://github.com/lin7c/ai-pow"
Repository = "https://github.com/lin7c/ai-pow"
Issues = "https://github.com/lin7c/ai-pow/issues"
Documentation = "https://github.com/lin7c/ai-pow/blob/main/docs/PROTOCOL-v0.1.md"

[project.scripts]
aipow = "ai_pow:main"

[tool.setuptools]
py-modules = ["ai_pow", "ai_pow_scoring", "ai_pow_report"]
