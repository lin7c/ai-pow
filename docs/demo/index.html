const data=JSON.parse(document.getElementById('report-data').textContent);
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=data.current,s=current.score,m=current.summary,e=s.evidence,stats=data.statistics||{},ladder=data.iteration;
const n=x=>x===null||x===undefined?'—':Number(x).toLocaleString('en-US',{maximumFractionDigits:1});
const short=x=>x===null||x===undefined?'—':Number(x)>=1e6?(Number(x)/1e6).toFixed(2)+'M':Number(x)>=1000?(Number(x)/1000).toFixed(1)+'K':n(x);
const pct=x=>x===null||x===undefined?'Not observed':Math.round(Number(x)*100)+'%';
const date=x=>new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const words={S:'Exceptional consistency',A:'Strong process',B:'Steady progress',C:'Building momentum',D:'High iteration cost',E:'Significant rework'};

const tokenLabel=b=>b.tokens_complete===false?'partial capture':b.tokens_estimated?'tokens (includes estimates)':'tokens';

$('#content').innerHTML=`
<div class="modebar"><div class="breadcrumb">Workspace / <strong>${esc(data.project)}</strong></div><div class="switch" aria-label="Report view"><button id="iteration" aria-pressed="true" ${data.view==='latest'?'disabled':''}>Iteration history</button><button id="latest" aria-pressed="false">Latest commit</button></div></div>
<div class="intro"><span class="eyebrow">01 / Latest recorded commit</span><span class="live">${data.demo?'Demonstration data':data.verification.integrity_verified?'Trace integrity checked':'Integrity not checked'}</span></div>
<section class="hero fade" aria-label="Current commit score"><div class="score-panel"><div class="score-top"><span class="label">AI-POW SCORE</span><span class="pill">${esc(s.status)}</span></div><div class="score-number">${esc(s.value)}<small>/ 100</small></div><div class="grade-line"><span class="grade">${esc(s.grade)}</span><span class="grade-label">${esc(words[s.grade])}</span></div><div class="scale" aria-hidden="true">${Array.from({length:20},(_,i)=>`<span class="${i<Number(s.value)/5?'on':''}"></span>`).join('')}</div><div class="scale-caption"><span>MORE REWORK</span><span>MORE RETAINED WORK</span></div><div class="hero-compare">${delta===null||delta===undefined?'Your first comparable commit.':`<strong>${delta>=0?'+':''}${n(delta)} pts</strong> vs. previous scored commit`}</div></div>
<div class="hero-copy"><div><span class="eyebrow">The work behind the version</span><h1>${esc(current.title)}</h1><p>A measured view of what survived, what it took, and where the process can improve. The score describes your development process, not code correctness.</p></div><div class="commit-meta"><button class="commit-id" id="copy-commit" title="Copy full commit hash">↳ ${esc(current.commit.slice(0,10))}</button><span>${esc(date(current.date))}</span><span>${esc(s.cohort.toUpperCase())} SCOPE · ${n(e.scope.units)} units</span></div></div></section>
${ladder?`<section class="ladder-card history-section" aria-label="Project iteration rating"><div><span class="eyebrow">Project ladder / cumulative process rating</span><div class="ladder-number">${n(ladder.value)}<small>${Number(ladder.delta)>=0?'+':''}${n(ladder.delta)} this commit</small></div><span class="ladder-tier">${esc(ladder.tier.toUpperCase())} · ${n(ladder.rated_commits)} EVIDENCE-BACKED ITERATIONS</span></div><div class="ladder-context"><span class="small">${ladder.next_tier?n(ladder.next_threshold-Number(ladder.value))+' points to '+esc(ladder.next_tier):'Diamond tier reached'}</span><div class="ladder-progress"><span style="width:${Math.max(0,Math.min(100,(Number(ladder.value)-1000)/750*100))}%"></span></div><p>Starts at 1,000. Strong, well-evidenced iterations build your rating gradually. Weak results can lower it; unobserved work earns no participation bonus.</p><p class="small">Project-local · ${esc(ladder.algorithm)} · not an opponent-based Elo or global rank.</p></div></section>`:''}
<div class="resource-row"><div class="resource"><span class="label">HUMAN INPUT</span><span class="number">${short(textTokens(m.human))}</span><span class="hint">${tokenLabel(m.human)} · ${n(m.human.messages||m.human.events||0)} prompts</span></div><div class="resource"><span class="label">VISIBLE AI OUTPUT</span><span class="number">${short(textTokens(m.visible_ai))}</span><span class="hint">${tokenLabel(m.visible_ai)} · user-facing text</span></div><div class="resource"><span class="label">REFERENCE COMPUTE</span><span class="number">${!m.priced_calls?'—':'$'+Number(m.reference_usd_known_subtotal).toFixed(2)}</span><span class="hint">${m.reference_cost_complete_for_observed_calls?'':'Known subtotal · '}${n(m.priced_calls)} priced / ${n((m.priced_calls||0)+(m.unpriced_calls||0))} observed calls</span></div><div class="resource"><span class="label">AGENT ACTIVITY</span><span class="number">${n(counts['tool.call']||0)}</span><span class="hint">tool calls · ${n(counts['agent.spawn']||0)} sub-agents</span></div></div>
<div class="section-heading"><h2>What shaped this score</h2><span class="note">Transparent weights. Smoothed evidence.</span></div><section class="breakdown" aria-label="Score breakdown"><div class="panel">${Object.entries(s.components).map(([key,c])=>`<div class="component"><div class="component-head"><span>${esc(c.label)}<span class="weight">${Math.round(Number(c.weight)*100)}%</span></span><strong>${c.ratio===null?'—':pct(c.ratio)}</strong></div><div class="meter"><span style="width:${Number(c.quality)*100}%"></span></div><div class="component-foot"><span>${key==='human'?'Temporal attribution proxy':key==='artifact'?'Compared with the committed tree':key==='task'?'Declared tasks with artifact evidence':'Scope-adjusted resource pressure'}</span><span>${pct(c.confidence)} evidence</span></div></div>`).join('')}</div><aside class="panel"><h3 class="aside-title">A score with context.</h3><div class="confidence"><div><span class="small">Evidence confidence</span><br><strong>${pct(s.confidence)}</strong></div><span class="pill">${esc(s.algorithm)}</span></div><div class="evidence-line"><span>Retained artifact operations</span><b>${n(e.artifact.retained)} / ${n(e.artifact.operations)}</b></div><div class="evidence-line"><span>Inputs linked to observed edits</span><b>${n(e.human.linked_prompts)} / ${n(e.human.prompts)}</b></div><div class="evidence-line"><span>Completed / declared task attempts</span><b>${n(e.task.completed)} / ${n(e.task.attempts)}</b></div><div class="evidence-line"><span>Changed files in this commit</span><b>${n(e.scope.files)}</b></div><p class="explain">${s.status==='provisional'?'This score is provisional. Sparse or missing evidence stays near a neutral 50 instead of becoming a perfect score.':'Enough evidence supports a more stable score. Additional observations still improve the reliability of the estimate.'} ${e.limited?'Some artifacts exceeded capture limits.':''}</p></aside></section>
<section class="history-section" aria-label="Iteration history"><div class="section-heading"><h2>The longer view</h2><span class="note">Previous first-parent commits · up to 30</span></div><div class="history-stats"><div class="history-stat"><span>Average commit score</span><strong>${n(stats.average)}</strong><small>${n(stats.count||0)} prior scored commits</small></div><div class="history-stat"><span>Same-scope average</span><strong>${n(stats.peer_average)}</strong><small>${n(stats.peer_count||0)} ${esc(s.cohort)}-scope comparisons</small></div><div class="history-stat"><span>Local percentile</span><strong>${stats.percentile===null||stats.percentile===undefined?'—':n(stats.percentile)+'%'}</strong><small>${(stats.peer_count||0)<3?'Needs 3 comparable prior commits':'Within this repository and scope'}</small></div><div class="history-stat"><span>Same score grade</span><strong>${n(stats.same_grade||0)}</strong><small>Prior commits in grade ${esc(s.grade)}</small></div></div><div class="panel chart-panel"><div class="chart-top"><span id="chart-label">PROJECT LADDER</span><div class="chart-tabs"><button id="chart-ladder" aria-pressed="true">Project rating</button><button id="chart-scores" aria-pressed="false">Commit scores</button></div><div class="legend"><span>Latest</span><span>Previous</span></div></div><div id="chart"></div></div><div class="timeline-toolbar"><h3>Commit journal</h3><div class="filters"><label class="small">Grade <select id="grade-filter" aria-label="Filter history by grade"><option value="all">All grades</option>${['S','A','B','C','D','E'].map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select></label><label class="small">Scope <select id="scope-filter" aria-label="Filter history by scope"><option value="all">All scopes</option><option value="same">Same scope</option></select></label></div></div><div class="history-list" id="journal"></div></section>
<details class="method"><summary>How the score is calculated</summary><div class="method-body"><div><p><strong>Retention contributes 70%.</strong> Input retention, artifact survival and task fulfillment use 40:40:20 proportions inside that share. Resource discipline supplies the remaining 30%.</p><p>Each observed retention ratio uses a Beta(2,2) prior. Evidence confidence grows gradually with observations. Missing dimensions retain their weight with neutral evidence; they are not silently removed.</p><p><code>score = 100 / (1 + exp(-5 × (L - 0.5)))</code></p></div><div><p><strong>L</strong> starts at 0.5 and adds each component's weighted, confidence-adjusted deviation from 0.5. The smooth curve avoids easy 0s and 100s. Grades: S ≥ 90, A ≥ 80, B ≥ 65, C ≥ 50, D ≥ 35, E below 35.</p><p>Same-scope comparisons exclude this commit, unscored history, and other score algorithms. Input attribution and task declarations remain local claims. The score is not a benchmark of developer ability or a security audit.</p><p><strong>Project ladder:</strong> starts at 1,000. Target = 1,000 + 25 × (commit score − 50). Each eligible iteration moves by at most 40 points, scaled by evidence confidence squared and scope. Gains diminish near the target; unobserved artifacts freeze the rating. The full available first-parent lineage is replayed, not just these 30 rows.</p></div></div></details>
<footer class="footer"><div class="proof">PROOF ${esc(current.proof_hash)}<br>Local consistency ${data.demo?'illustrated':'checked'} · execution authenticity and complete capture are not attested.</div><div class="footer-brand">AI-PoW <span class="small">/ Work, made visible.</span></div></footer>`;
function setView(view){document.body.classList.toggle('latest-only',view==='latest');$('#iteration').setAttribute('aria-pressed',String(view==='iteration'));$('#latest').setAttribute('aria-pressed',String(view==='latest'));try{history.replaceState(null,'','#'+view)}catch{}}
$('#iteration').addEventListener('click',()=>setView('iteration'));$('#latest').addEventListener('click',()=>setView('latest'));setView(data.view==='latest'||location.hash==='#latest'?'latest':'iteration');
let chartMode=ladder?'ladder':'scores';
function chart(){
  const isLadder=chartMode==='ladder';
  const rows=isLadder?[...data.history.filter(p=>p.iteration).reverse(),{...current,iteration:ladder}]:[...data.history.filter(p=>p.score&&p.score.algorithm===s.algorithm).reverse(),current];
  const value=p=>Number(isLadder?p.iteration?.value||1000:p.score.value),values=rows.map(value);
  const low=isLadder?Math.floor((Math.min(1000,...values)-30)/100)*100:0,high=isLadder?Math.ceil((Math.max(1000,...values)+30)/100)*100:100;
  const w=1060,h=225,left=isLadder?50:34,right=24,top=20,bottom=40,x=i=>left+(w-left-right)*i/Math.max(1,rows.length-1),y=v=>top+(h-top-bottom)*(1-(v-low)/(high-low));
  let svg=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${isLadder?'Cumulative project rating':'Individual commit scores'} across recorded commits, with latest last">`;
  for(let v=isLadder?low:20;v<=high;v+=isLadder?Math.max(50,Math.ceil((high-low)/500)*100):20)svg+=`<line x1="${left}" x2="${w-right}" y1="${y(v)}" y2="${y(v)}" stroke="#e1e4d8"/><text x="0" y="${y(v)+3}">${v}</text>`;
  if(rows.length>1)svg+=`<polyline points="${rows.map((p,i)=>`${x(i)},${y(value(p))}`).join(' ')}" fill="none" stroke="#8b9f73" stroke-width="2.5"/>`;
  rows.forEach((p,i)=>{const latest=i===rows.length-1;svg+=`<circle cx="${x(i)}" cy="${y(value(p))}" r="${latest?6:4}" fill="${latest?'#3d5837':'#a6b485'}"><title>${esc(p.commit.slice(0,7)+' · '+value(p)+' · '+p.title)}</title></circle>`;if(i===0||latest||rows.length<9)svg+=`<text x="${x(i)}" y="${h-12}" text-anchor="${latest?'end':i===0?'start':'middle'}">${latest?'LATEST':esc(p.commit.slice(0,7))}</text>`;if(latest)svg+=`<text x="${x(i)-10}" y="${y(value(p))-12}" text-anchor="end" style="fill:#3d5837;font-weight:bold">${n(value(p))}</text>`});
  $('#chart').innerHTML=svg+'</svg>';$('#chart-label').textContent=isLadder?'PROJECT RATING / LADDER-V1':'COMMIT SCORE / 100';$('#chart-ladder').setAttribute('aria-pressed',String(isLadder));$('#chart-scores').setAttribute('aria-pressed',String(!isLadder));
}
$('#chart-ladder').addEventListener('click',()=>{chartMode='ladder';chart()});$('#chart-scores').addEventListener('click',()=>{chartMode='scores';chart()});chart();
function journal(){const grade=$('#grade-filter').value,scope=$('#scope-filter').value,rows=data.history.filter(p=>(grade==='all'||p.score?.grade===grade)&&(scope==='all'||p.score?.cohort===s.cohort));$('#journal').innerHTML=rows.length?rows.map(p=>`<button class="history-row" data-commit="${esc(p.commit)}" aria-label="Inspect commit ${esc(p.commit.slice(0,7))}"><span class="hash">${esc(p.commit.slice(0,7))}</span><span class="subject">${esc(p.title)}</span><span class="date">${esc(date(p.date))}</span><span class="row-score">${p.score?esc(p.score.value):'—'}${p.iteration?`<small class="row-rating">${n(p.iteration.value)} RP</small>`:''}</span><span class="row-grade">${p.score?esc(p.score.grade):'N/A'}</span></button>`).join(''):'<p class="empty">'+(data.history.length?'No commits match these filters.':'No previous commits yet. Your next report can start the trend.')+'</p>';document.querySelectorAll('.history-row').forEach(button=>button.addEventListener('click',()=>inspect(data.history.find(p=>p.commit===button.dataset.commit))))}journal();$('#grade-filter').addEventListener('change',journal);$('#scope-filter').addEventListener('change',journal);
function inspect(p){const dialog=$('#commit-dialog');$('#dialog-body').innerHTML=`<span class="eyebrow">Historical commit · ${esc(p.commit.slice(0,10))}</span><h2>${esc(p.title)}</h2><div class="dialog-score">${p.score?esc(p.score.value):'—'} <span class="grade">${p.score?esc(p.score.grade):'?'}</span></div><p class="small">${p.score?esc(p.score.cohort)+' scope · '+pct(p.score.confidence)+' evidence confidence':'No AI-PoW proof was recorded for this commit.'}</p><p class="small">${esc(date(p.date))}</p>${p.iteration?`<p class="small">Project rating: ${n(p.iteration.value)} · ${esc(p.iteration.tier)} · ${Number(p.iteration.delta)>=0?'+':''}${n(p.iteration.delta)} RP</p>`:''}<p class="small">The latest commit stays the main report. This panel only inspects a prior version.</p>`;dialog.showModal()}
$('#close-dialog').addEventListener('click',()=>$('#commit-dialog').close());$('#print').addEventListener('click',()=>window.print());$('#copy-commit').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(current.commit);notify('Commit hash copied')}catch{notify('Commit: '+current.commit)}});function notify(message){const t=$('#toast');t.textContent=message;t.hidden=false;setTimeout(()=>{t.hidden=true},4500)}
</script></body></html>
