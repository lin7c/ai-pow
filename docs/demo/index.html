:root{--paper:#141a24;--card:#1e2836;--raised:#243040;--line:#3a4759;--hair:#2a3543;--ink:#f2f5f9;--muted:#a9b8cb;--dim:#7c8ca1;--accent:#ff9c31;--good:#63d29a;--bad:#ff7a6b;--paper-ink:#16202c;--mono:'SFMono-Regular',Consolas,'Liberation Mono',monospace;--sans:'Lato','Trebuchet MS','Segoe UI',Arial,sans-serif;--display:'Lato','Arial Narrow',Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 var(--sans)}
button,select,a{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3,p,dl,dd,table{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 40px}
.skip{position:absolute;top:-90px;left:20px;background:#fff;color:#111;padding:12px;z-index:10}.skip:focus{top:10px}
.num{font-variant-numeric:tabular-nums}
.banner{background:var(--raised);text-align:center;padding:9px 20px;font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mast{background:#0e141d;border-bottom:3px solid var(--accent)}
.mast .wrap{min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:14px;font:900 italic 26px var(--display);letter-spacing:-.03em}
.mark{display:flex;gap:4px;transform:skew(-16deg)}.mark i{width:8px;height:24px;background:var(--accent)}.mark i:last-child{height:17px;align-self:flex-end;background:var(--ink)}
.edition{font:10px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-style:normal;font-weight:400}
.acts{display:flex;align-items:center;gap:10px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 15px;font:900 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;min-height:40px;display:inline-flex;align-items:center;text-decoration:none}
.ghost:hover{background:var(--raised);color:var(--ink);text-decoration:none}
.ident{display:grid;grid-template-columns:repeat(6,auto);justify-content:start;gap:0 42px;margin:30px 0 0;padding-bottom:22px;border-bottom:1px solid var(--line);font:11px var(--mono)}
.ident div{min-width:0}.ident span{display:block;color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.ident b{font-weight:400;color:var(--ink);overflow-wrap:anywhere}
.ok{color:var(--good)}.warn{color:var(--accent)}
h1.title{font:900 italic clamp(26px,3.2vw,44px)/1.05 var(--display);letter-spacing:-.02em;text-transform:uppercase;margin:26px 0 8px;overflow-wrap:anywhere}
.lede{color:var(--muted);font-size:12.5px;max-width:760px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--line);margin:26px 0 0;border-top:3px solid var(--accent)}
.five div{background:var(--card);padding:20px 20px 22px;min-width:0}
.five span{display:block;font:9px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.five b{display:block;font:900 italic 32px/1.15 var(--display);letter-spacing:-.03em;margin:10px 0 4px;overflow-wrap:anywhere}
.five small{font:10px var(--mono);color:var(--dim)}
.section{margin-top:46px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
.section-head h2{font:900 italic 22px var(--display);letter-spacing:-.01em;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.section-head h2:before{content:'';width:6px;height:17px;background:var(--accent);transform:skew(-16deg)}
.section-head .note{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-align:right}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.cols.two{grid-template-columns:1fr 1fr}
.box{background:var(--card);padding:20px 22px 22px;min-width:0}
.box h3{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:400;margin-bottom:14px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--hair);font:11px var(--mono);color:var(--dim)}
.kv:first-of-type{border-top:0}
.kv b{color:var(--ink);font-weight:400;text-align:right;overflow-wrap:anywhere}
.kv.none b{color:var(--dim)}.kv.lead b{font:900 italic 17px var(--display)}
.mix{margin-top:6px}
.mix-row{display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center;margin-top:11px;font:11px var(--mono)}
.mix-row .name{color:var(--ink)}.mix-row .pct{text-align:right;color:var(--muted)}
.mix-bar{grid-column:1/3;height:8px;background:var(--hair)}.mix-bar i{display:block;height:100%;background:var(--accent)}
.mix-row .sub{grid-column:1/3;color:var(--dim);font-size:10px}
.tree{margin:6px 0 0;font:11px/1.7 var(--mono);color:var(--muted);white-space:pre;overflow:auto;max-height:220px}
.tree b{color:var(--accent);font-weight:400}
table{width:100%;border-collapse:collapse;font:11px var(--mono)}
th{text-align:left;color:var(--dim);font-weight:400;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair);color:var(--muted);overflow-wrap:anywhere}
td.path{color:var(--ink)}td.right,th.right{text-align:right;padding-right:0}
.meter{display:inline-block;width:74px;height:6px;background:var(--hair);vertical-align:middle;margin-right:9px}
.meter i{display:block;height:100%;background:var(--accent)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:0}
.tl{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:10px 0 10px 18px;position:relative;font:11px var(--mono)}
.tl:before{content:'';position:absolute;left:-5px;top:17px;width:8px;height:8px;background:var(--line)}
.tl.rework:before{background:var(--accent)}.tl.task:before{background:var(--good)}
.tl .at{color:var(--dim)}.tl .what{color:var(--ink)}.tl .detail{color:var(--muted)}
.prov{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.prov div{background:var(--card);padding:18px 20px 20px}
.prov h4{font:900 italic 15px var(--display);text-transform:uppercase;margin:0 0 10px}
.prov ul{margin:0;padding-left:16px;font:11px/1.9 var(--mono);color:var(--muted)}
.prov p{font-size:11px;color:var(--dim);margin-top:10px}
.derived-score{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--card);border-left:3px solid var(--accent);padding:16px 20px;margin-top:2px}
.derived-score b{font:900 italic 28px var(--display)}
.derived-score span{font:10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.derived-score .dims{font:11px var(--mono);color:var(--muted)}
.total-card{display:grid;grid-template-columns:minmax(280px,1fr) 1fr;gap:26px;background:var(--accent);color:var(--paper-ink);padding:26px 30px;position:relative;overflow:hidden}
.total-card:after{content:'\03A3';position:absolute;right:30px;top:-48px;font:900 italic 190px/1 var(--display);opacity:.09}
.total-card .eyebrow{color:#4a3a22;font-weight:700;font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.total-figure{font:900 italic 62px/.95 var(--display);letter-spacing:-.05em;margin:10px 0 4px}
.total-figure small{font:900 14px var(--sans);letter-spacing:0;margin-left:12px}
.total-card .blurb{font-size:12px;max-width:430px;margin:10px 0 0;position:relative}
.equation{font:900 italic 22px var(--display);position:relative}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.chart-cell{background:var(--card);padding:16px 18px 10px}
.chart-cell span{display:block;font:9px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.chart-cell b{display:block;font:900 italic 21px var(--display);margin:6px 0 2px}
.chart-cell em{font:9px var(--mono);font-style:normal;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-left:8px}
.chart-cell svg{display:block;width:100%}
.style-card{display:grid;grid-template-columns:1fr 2fr;gap:2px;background:var(--line)}
.pattern{background:var(--card);padding:24px}
.pattern b{display:block;font:900 italic 27px/1.15 var(--display);text-transform:uppercase;margin:10px 0}
.pattern p{font-size:11px;color:var(--dim)}
.levels{background:var(--card);padding:24px}
.level{display:grid;grid-template-columns:150px 92px 1fr;gap:14px;align-items:center;padding:9px 0;border-top:1px solid var(--hair);font:11px var(--mono)}
.level:first-child{border-top:0}
.level .tag{font:900 10px var(--sans);letter-spacing:.12em;text-transform:uppercase}
.level .tag.high{color:var(--accent)}.level .tag.low{color:var(--good)}.level .tag.medium{color:var(--muted)}
.level .why{color:var(--dim)}
.rows{margin-top:12px;border-top:2px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:78px 1fr 96px 140px 74px;align-items:center;gap:16px;background:var(--card);border:0;border-bottom:1px solid var(--hair);padding:14px;text-align:left;text-decoration:none}
.row:nth-child(even){background:var(--paper)}
.row:hover{background:var(--raised);box-shadow:inset 4px 0 var(--accent);text-decoration:none}
.row .hash{font:10px var(--mono);color:var(--accent)}
.row .subject{font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{font:10px var(--mono);color:var(--dim)}
.row .delta{font:10px var(--mono);color:var(--muted);text-align:right}
.row .total{font:900 italic 19px var(--display);text-align:right;color:var(--ink)}
.row.is-latest .subject:after{content:'LATEST';font:9px var(--mono);letter-spacing:.1em;color:var(--accent);margin-left:10px}
.empty{padding:26px 14px;color:var(--dim);font-size:13px;background:var(--card)}
.legend{margin-top:14px;font:10px/1.8 var(--mono);color:var(--dim)}
.foot{margin-top:52px;border-top:1px solid var(--line);padding:20px 0 40px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font:9.5px/1.8 var(--mono);color:var(--dim)}
.foot .id{max-width:68%;overflow-wrap:anywhere}
@media(max-width:1040px){.five{grid-template-columns:repeat(3,1fr)}.cols,.charts,.prov{grid-template-columns:repeat(2,1fr)}.ident{grid-template-columns:repeat(3,auto);gap:18px 32px}}
@media(max-width:760px){
.wrap{padding:0 18px}.logo{font-size:21px}.edition{display:none}
.five,.cols,.cols.two,.charts,.prov,.style-card,.total-card{grid-template-columns:1fr}
.ident{grid-template-columns:repeat(2,auto)}.five b{font-size:27px}
.total-figure{font-size:52px}.total-card:after{display:none}
.row{grid-template-columns:66px 1fr 58px 72px;gap:10px;padding:13px 8px}.row .when{display:none}
.level{grid-template-columns:1fr 80px;row-gap:4px}.level .why{grid-column:1/3}
.tl{grid-template-columns:66px 1fr;gap:10px}.section{margin-top:34px}
table.files td.wide,table.files th.wide{display:none}
}
@media print{
body{background:#fff;color:#16202c}.ghost,.acts,.banner{display:none}
.five div,.box,.chart-cell,.pattern,.levels,.row,.prov div{background:#fff}
.five,.cols,.charts,.prov,.style-card{background:#ccd4de}
.total-card{background:#fff;border:2px solid var(--accent)}.total-card:after{display:none}
.kv,.legend,.foot,.lede,.tl .detail{color:#4b5563}.section,.box,.row{break-inside:avoid}
.wrap{max-width:none;padding:0 12px}
}

visible_tokens":1782,"awc":"10.000004","model_calls":38,"tool_calls":73,"sub_agents":4,"sessions":2,"operations":86,"retained":53},{"commit":"be74e76d2f05efdebba6be1254e4c83046d32148","title":"Release v0.2: process scoring, project ladder, and offline commit reports","date":"2026-09-12T12:15:07+00:00","score":{"algorithm":"retention-v2","value":"45.1","grade":"D","confidence":"0.4134","status":"provisional","cohort":"extensive","components":{"artifact":{"label":"Artifact survival","weight":"0.40","ratio":"0.399457","quality":"0.400538","confidence":"0.494623","effective_weight":"0.400000"},"human":{"label":"Input retention","weight":"0.40","ratio":"0.400000","quality":"0.409091","confidence":"0.318182","effective_weight":"0.400000"},"task":{"label":"Task fulfillment","weight":"0.20","ratio":"0.400000","quality":"0.411765","confidence":"0.441177","effective_weight":"0.200000"}},"evidence":{"artifact":{"retained":147,"operations":368,"checked_operations":368},"human":{"retained_weight":"1600.0","observed_weight":4000,"linked_prompts":40,"prompts":40,"attribution":"temporal-proxy"},"task":{"completed":12,"attempts":30,"declared":30,"basis":"declared-with-committed-evidence"},"scope":{"units":184,"files":20},"limited":false,"gaps":1},"dimensions":{"scored":["artifact","human","task"],"unscored":[]},"meaning":"process-retention-score","quality_verified":false},"total":"45.1","span_ms":32767500,"human_tokens":3600,"prompts":40,"visible_tokens":1600,"awc":"13.263156","model_calls":36,"tool_calls":73,"sub_agents":4,"sessions":4,"operations":368,"retained":147}],"commits_in_history":7,"statistics":{"count":6,"average":62.2,"delta":-10.1,"peer_count":2,"peer_average":63.5,"percentile":null,"same_grade":1},"span":{"first":{"commit":"be74e76d2f05efdebba6be1254e4c83046d32148","date":"2026-09-12T12:15:07+00:00"},"last":{"commit":"135c812f3ad6cfa5e5e164296f053771331f176f","date":"2026-09-12T14:19:31+00:00"}},"links":{"commit":"reports/"}}</script><script>
const data=JSON.parse(document.getElementById('report-data').textContent);
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unknown='not recorded';
const n=x=>x===null||x===undefined?unknown:Number(x).toLocaleString('en-US',{maximumFractionDigits:1});
const short=x=>x===null||x===undefined?unknown:Number(x)>=1e6?(Number(x)/1e6).toFixed(2)+'M':Number(x)>=1000?(Number(x)/1e3).toFixed(1)+'K':n(x);
const pct=(x,digits)=>x===null||x===undefined?unknown:(Number(x)*100).toFixed(digits===undefined?1:digits)+'%';
const points=x=>x===null||x===undefined?unknown:Number(x).toFixed(1);
const money=x=>x===null||x===undefined?unknown:'$'+Number(x).toFixed(2);
const awc=x=>x===null||x===undefined?unknown:Number(x).toFixed(2);
const when=x=>new Date(x).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const day=x=>new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const clock=x=>new Date(x).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const span=ms=>{if(ms===null||ms===undefined)return unknown;const sec=Math.round(ms/1000);
  if(sec<90)return sec+'s';const min=Math.round(sec/60);if(min<90)return min+'m';
  const hr=Math.floor(min/60);if(hr<48)return hr+'h '+String(min%60).padStart(2,'0')+'m';
  return Math.floor(hr/24)+'d '+(hr%24)+'h'};
const ratio=(part,whole)=>whole?part/whole:null;
const kv=(k,v,lead)=>`<div class="kv${v===null||v===undefined?' none':''}${lead?' lead':''}"><span>${esc(k)}</span><b>${esc(v===null||v===undefined?unknown:v)}</b></div>`;
const box=(title,rows,extra)=>`<section class="box"><h3>${esc(title)}</h3>${(rows||[]).join('')}${extra||''}</section>`;
function sparkline(values,host){
  const width=host.clientWidth||260,height=52,pad=3;
  const clean=values.map(v=>v===null||v===undefined?null:Number(v));
  const known=clean.filter(v=>v!==null);
  if(!known.length)return host.innerHTML='<p class="kv none"><b>not recorded</b></p>';
  const high=Math.max(...known),low=Math.min(0,...known),range=high-low||1;
  const x=i=>pad+(width-2*pad)*i/Math.max(1,clean.length-1),y=v=>height-pad-(height-2*pad)*(v-low)/range;
  let path='',dots='';
  clean.forEach((v,i)=>{if(v===null)return;path+=(path?' L':'M')+x(i)+' '+y(v);
    if(i===clean.length-1)dots+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#ff9c31"/>`});
  host.innerHTML=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">`
    +`<path d="${path}" fill="none" stroke="#ff9c31" stroke-width="2"/>${dots}</svg>`;
}

const lt=data.lifetime,total=data.iteration,rows=data.history,stats=data.statistics||{};
document.title=data.project+' · AI-PoW history';
if(data.demo){const b=document.createElement('div');b.className='banner';b.textContent='Demonstration · real commits from this repository, synthetic evidence';document.body.insertBefore(b,document.body.children[1])}
const dayCount=data.span.first&&data.span.last?Math.max(1,Math.round((new Date(data.span.last.date)-new Date(data.span.first.date))/86400000)):null;
const days=dayCount===null?unknown:n(dayCount)+(dayCount===1?' day':' days');
const perOperation=lt.artifact_operations?lt.human_tokens/lt.artifact_operations:null;
const awcPerOperation=lt.artifact_operations&&lt.reference_usd_known_subtotal!==null?Number(lt.reference_usd_known_subtotal)/lt.artifact_operations:null;
const rework=lt.artifact_survival===null?null:1-Number(lt.artifact_survival);
const level=(value,high,low)=>value===null||value===undefined?['unknown','—']:value>=high?['high','HIGH']:value<=low?['low','LOW']:['medium','MEDIUM'];
const human=level(perOperation,40,15),machine=level(awcPerOperation,.05,.02),churn=level(rework,.4,.2);
const pattern=human[0]==='high'&&machine[0]==='low'?'Human-guided / low-cost AI'
  :human[0]==='low'&&machine[0]==='high'?'Autonomous / high-compute'
  :human[0]==='unknown'||machine[0]==='unknown'?'Not enough recorded history':'Balanced';

$('#content').innerHTML=`
<div class="ident">
  <div><span>Project</span><b>${esc(data.project)}</b></div>
  <div><span>Commits with proof</span><b>${n(lt.scored_commits)} of ${n(data.commits_in_history)}</b></div>
  <div><span>Development span</span><b>${esc(days)}</b></div>
  <div><span>Recorded time</span><b>${esc(span(lt.span_ms))}</b></div>
  <div><span>Sessions</span><b>${n(lt.sessions)}</b></div>
  <div><span>Algorithms</span><b>${esc(lt.algorithms.join(', ')||unknown)}</b></div>
</div>
<h1 class="title">${esc(data.project)} · AI development history</h1>
<p class="lede">Pooled quantities over every commit that carries a proof. Ratios are recomputed from the pooled totals, never averaged per commit, and unknown values stay unknown instead of counting as zero.</p>
<div class="five">
  <div><span>Human input</span><b class="num">${short(lt.human_tokens)}</b><small>tokens · ${n(lt.prompts)} prompts</small></div>
  <div><span>AI visible output</span><b class="num">${short(lt.visible_tokens)}</b><small>tokens · ${n(lt.visible_events)} messages</small></div>
  <div><span>Machine work</span><b class="num">${lt.priced_calls?awc(lt.reference_usd_known_subtotal):unknown}</b><small>AWC · ${n(lt.model_calls)} model calls</small></div>
  <div><span>Agent calls</span><b class="num">${n(lt.tool_calls+lt.sub_agents)}</b><small>${n(lt.sub_agents)} sub-agents</small></div>
  <div><span>Artifact survival</span><b class="num">${lt.artifact_operations?pct(lt.artifact_survival):unknown}</b><small>${n(lt.artifact_retained)} of ${n(lt.artifact_operations)} edits</small></div>
</div>

<div class="section">
  <div class="section-head"><h2>Trends</h2><span class="note">Per commit · oldest to newest · ${n(rows.length)} shown</span></div>
  <div class="charts" id="charts"></div>
  <p class="legend">A project that matures should need fewer human tokens and less rework for the same amount of surviving work. These lines are the evidence for that question, not an answer to it.</p>
</div>

<div class="section">
  <div class="section-head"><h2>Development style</h2><span class="note">Descriptive · not a score</span></div>
  <div class="style-card">
    <div class="pattern"><span class="edition">Pattern</span><b>${esc(pattern)}</b>
      <p>Derived from the pooled ratios on the right. It describes how this project uses AI, not how well it does.</p></div>
    <div class="levels">
      <div class="level"><span>Human input</span><span class="tag ${human[0]}">${human[1]}</span>
        <span class="why">${perOperation===null?unknown:n(perOperation)+' prompt tokens per semantic edit · high ≥ 40, low ≤ 15'}</span></div>
      <div class="level"><span>Machine compute</span><span class="tag ${machine[0]}">${machine[1]}</span>
        <span class="why">${awcPerOperation===null?unknown:awc(awcPerOperation)+' AWC per semantic edit · high ≥ 0.05, low ≤ 0.02'}</span></div>
      <div class="level"><span>Rework</span><span class="tag ${churn[0]}">${churn[1]}</span>
        <span class="why">${rework===null?unknown:pct(rework,0)+' of observed edits did not survive · high ≥ 40%, low ≤ 20%'}</span></div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Pooled totals</h2><span class="note">Unknown stays unknown</span></div>
  <div class="cols">
    ${box('Machine',[kv('Reference compute',lt.priced_calls?awc(lt.reference_usd_known_subtotal)+' AWC':null,true),
      kv('Actual cost',lt.actual_priced_calls?money(lt.actual_usd_known_subtotal):null),
      kv('Model tokens',short(lt.input_tokens===null||lt.output_tokens===null?null:lt.input_tokens+lt.output_tokens)),
      kv('Reasoning tokens',short(lt.reasoning_tokens)),kv('Model calls',n(lt.model_calls))])}
    ${box('Agent',[kv('Tool calls',n(lt.tool_calls),true),kv('Failed tool results',n(lt.failed_tool_calls)),
      kv('Sub-agents',n(lt.sub_agents)),kv('Skills / MCP',`${n(lt.skills_used)} / ${n(lt.mcp_used)}`),
      kv('Wrapped runs',n(lt.runs)),kv('Coverage gaps',n(lt.coverage_gaps))])}
    ${box('Artifact and tasks',[kv('Semantic edits',n(lt.artifact_operations),true),kv('Surviving edits',n(lt.artifact_retained)),
      kv('Artifact survival',lt.artifact_operations?pct(lt.artifact_survival):null),
      kv('Rework',rework===null?null:pct(rework)),
      kv('Task fulfillment',lt.task_attempts?pct(lt.task_fulfillment):null)])}
  </div>
</div>

${total?`<div class="section">
  <div class="section-head"><h2>Cumulative score</h2><span class="note">Derived · ${esc(total.algorithm)}</span></div>
  <div class="total-card">
    <div><span class="eyebrow">Project total</span>
      <p class="total-figure num">${points(total.value)}<small>+${points(total.delta)} LATEST</small></p>
      <p class="total-meta" style="font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase">${n(total.rated_commits)} scored commits · started at 0</p></div>
    <div style="align-self:center"><p class="equation num">${points(total.previous)} + ${points(total.delta)} = ${points(total.value)}</p>
      <p class="blurb">Every recorded commit score, added once and unchanged. It grows with the number of recorded commits, so it measures accumulated recorded work, not quality. Average commit score ${points(stats.average)}.</p></div>
  </div>
</div>`:''}

<div class="section">
  <div class="section-head"><h2>Recorded commits</h2><span class="note">Newest first · open one for its full proof</span></div>
  <div class="rows">${rows.map((p,i)=>`<a class="row${i===0?' is-latest':''}" href="${esc((data.links&&data.links.commit)||'reports/')}${esc(p.commit)}.html">
    <span class="hash">${esc(p.commit.slice(0,7))}</span><span class="subject">${esc(p.title)}</span>
    <span class="when">${esc(day(p.date))}</span>
    <span class="delta">${p.span_ms===null||p.span_ms===undefined?'':esc(span(p.span_ms))}${p.awc?' · '+awc(p.awc)+' AWC':''}</span>
    <span class="total num">${p.operations?pct(ratio(p.retained,p.operations),0):'—'}</span></a>`).join('')||'<p class="empty">No commits recorded yet.</p>'}</div>
  <p class="legend">The right-hand column is artifact survival for that commit. Duration and AWC come from its own proof.</p>
</div>`;

const series=[...rows].reverse();
const percent=v=>v===null?unknown:Math.round(v)+'%';
const charts=[['Human tokens / commit',series.map(p=>p.human_tokens),short],
  ['AWC / commit',series.map(p=>p.awc===null||p.awc===undefined?null:Number(p.awc)),awc],
  ['Artifact survival',series.map(p=>p.operations?100*p.retained/p.operations:null),percent],
  ['Rework ratio',series.map(p=>p.operations?100*(1-p.retained/p.operations):null),percent],
  ['Agent calls / commit',series.map(p=>p.tool_calls+p.sub_agents),n],
  ['Duration / commit',series.map(p=>p.span_ms===null||p.span_ms===undefined?null:p.span_ms),span]];
const latestOf=values=>{for(let i=values.length-1;i>=0;i--)if(values[i]!==null&&values[i]!==undefined)return values[i];return null};
$('#charts').innerHTML=charts.map((c,i)=>`<div class="chart-cell"><span>${esc(c[0])}</span><b>${esc(c[2](latestOf(c[1])))}<em>latest</em></b><div id="spark-${i}"></div></div>`).join('');
function draw(){charts.forEach((c,i)=>sparkline(c[1],document.getElementById('spark-'+i)))}
draw();
let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(draw,150)});

document.getElementById('print').addEventListener('click',()=>window.print());</script></body></html>
