const clock=x=>new Date(x).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const span=ms=>{if(ms===null||ms===undefined)return unknown;const sec=Math.round(ms/1000);
  if(sec<90)return sec+'s';const min=Math.round(sec/60);if(min<90)return min+'m';
  const hr=Math.floor(min/60);if(hr<48)return hr+'h '+String(min%60).padStart(2,'0')+'m';
  return Math.floor(hr/24)+'d '+(hr%24)+'h'};
const ratio=(part,whole)=>whole?part/whole:null;
const kv=(k,v,lead)=>`<div class="kv${v===null||v===undefined?' none':''}${lead?' lead':''}"><span>${esc(k)}</span><b>${esc(v===null||v===undefined?unknown:v)}</b></div>`;
const box=(title,rows,extra)=>`<section class="box"><h3>${esc(title)}</h3>${(rows||[]).join('')}${extra||''}</section>`;
function sparkline(values,host){
  const width=host.clientWidth||260,height=52,pad=3;
  const clean=values.map(v=>v===null||v===undefined?null:Number(v));
  const known=clean.filter(v=>v!==null);
  if(!known.length)return host.innerHTML='<p class="kv none"><b>not recorded</b></p>';
  const high=Math.max(...known),low=Math.min(0,...known),range=high-low||1;
  const x=i=>pad+(width-2*pad)*i/Math.max(1,clean.length-1),y=v=>height-pad-(height-2*pad)*(v-low)/range;
  let path='',dots='';
  clean.forEach((v,i)=>{if(v===null)return;path+=(path?' L':'M')+x(i)+' '+y(v);
    if(i===clean.length-1)dots+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#ff9c31"/>`});
  host.innerHTML=`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true">`
    +`<path d="${path}" fill="none" stroke="#ff9c31" stroke-width="2"/>${dots}</svg>`;
}

const c=data.current,s=c.score,m=c.summary,e=s.evidence,d=data.derived,v=data.verification;
const counts=m.event_counts||{},models=m.models||{},agent=m.agent||null,act=m.activity||null,win=m.window||null;
const modelSum=f=>{let t=0;for(const b of Object.values(models)){if(b[f]===null||b[f]===undefined)return null;t+=b[f]}return t};
const modelCalls=Object.values(models).reduce((t,b)=>t+(b.calls||0),0);
const tokens=b=>b.tokens_complete===false?null:(b.tokens_estimated||0)+(b.tokens_measured||0);
const agentCalls=(counts['tool.call']||0)+(counts['agent.spawn']||0)+(counts['skill.used']||0);
document.title=c.commit.slice(0,7)+' · '+data.project+' · AI-PoW proof';
if(data.demo){const b=document.createElement('div');b.className='banner';b.textContent='Demonstration · real commit from this repository, synthetic evidence';document.body.insertBefore(b,document.body.children[1])}

function modelMix(){
  const rows=Object.entries(models).map(([key,b])=>({name:key.split('/')[0],basis:key.split('/')[1],calls:b.calls||0,
    tokens:(b.input_tokens||0)+(b.output_tokens||0),usd:b.reference_usd===undefined?null:b.reference_usd}));
  const total=rows.reduce((t,r)=>t+r.tokens,0);
  if(!rows.length)return '<p class="kv none"><b>no model usage recorded</b></p>';
  return '<div class="mix">'+rows.sort((a,b)=>b.tokens-a.tokens).map(r=>`<div class="mix-row">
    <span class="name">${esc(r.name)}</span><span class="pct">${total?pct(ratio(r.tokens,total),0):'—'}</span>
    <span class="mix-bar"><i style="width:${total?Math.round(100*r.tokens/total):0}%"></i></span>
    <span class="sub">${short(r.tokens)} tokens · ${n(r.calls)} calls · ${esc(r.basis)}</span></div>`).join('')+'</div>';
}

function tree(){
  if(!agent||!agent.graph.length)return '<p class="kv none"><b>no sub-agents recorded</b></p>';
  const calls=new Map(agent.tool_calls_by_name||[]);
  const spawned=new Set(agent.graph.map(([id])=>id)),kids=new Map(),roots=[];
  const push=(key,id)=>{if(!kids.has(key))kids.set(key,[]);kids.get(key).push(id)};
  for(const [id,parent] of agent.graph){
    if(!parent)roots.push(id);
    else if(spawned.has(parent))push(parent,id);
    else{if(!kids.has(parent)){kids.set(parent,[]);roots.push(parent)}push(parent,id)}
  }
  const lines=[],seen=new Set();
  const walk=(id,prefix,last,top)=>{
    if(lines.length>=26||seen.has(id))return;
    seen.add(id);
    lines.push((top?'':prefix+'<b>'+(last?'└─ ':'├─ ')+'</b>')+esc(id.slice(0,30))+(spawned.has(id)?'':'  (primary)'));
    const children=kids.get(id)||[];
    children.forEach((child,i)=>walk(child,top?'':prefix+(last?'   ':'│  '),i===children.length-1,false));
  };
  roots.forEach(id=>walk(id,'',true,true));
  if(seen.size<agent.graph.length||agent.truncated)lines.push('… bounded by capture limits');
  const tools=(agent.tool_calls_by_name||[]).slice(0,8).map(([name,count])=>`${esc(name)} ×${n(count)}`);
  return `<div class="tree">${lines.join('\n')}</div>`+(tools.length?`<p class="legend">Tool calls: ${tools.join(' · ')}${agent.other_tool_calls?' · other ×'+n(agent.other_tool_calls):''}</p>`:'');
}

function files(){
  if(!d.files.length)return '<p class="empty">No file observations were recorded in this interval.</p>';
  const rows=d.files.map(f=>{const survival=ratio(f.retained,f.operations);
    return `<tr><td class="path">${esc(f.path||('unresolved '+f.id))}</td>
      <td class="right">${n(f.operations)}</td><td class="right wide">${n(f.writes)}</td>
      <td class="right wide">${n(f.overwritten)}</td>
      <td class="right">${f.checked?`<span class="meter"><i style="width:${Math.round((survival||0)*100)}%"></i></span>${pct(survival,0)}`:'not in tree'}</td></tr>`}).join('');
  return `<table class="files"><thead><tr><th>File</th><th class="right">Edits</th><th class="right wide">Writes</th>
    <th class="right wide">Overwritten</th><th class="right">Survival</th></tr></thead><tbody>${rows}</tbody></table>`
    +(d.files_total>d.files.length?`<p class="legend">${n(d.files_total-d.files.length)} more files omitted.</p>`:'');
}

function reworked(){
  const worst=[...d.files].filter(f=>f.overwritten||f.reintroduced).sort((a,b)=>(b.overwritten+b.reintroduced*2)-(a.overwritten+a.reintroduced*2)).slice(0,4);
  if(!worst.length)return kv('Overwritten edits','none observed');
  return worst.map((f,i)=>kv((i+1)+'. '+(f.path||f.id),`${n(f.overwritten)} overwritten${f.reintroduced?', '+n(f.reintroduced)+' re-added':''}`)).join('');
}

function timeline(){
  if(!d.timeline.length)return '<p class="empty">No timestamped session, task or rework events were recorded.</p>';
  return '<div class="timeline">'+d.timeline.map(item=>`<div class="tl ${esc(item.kind)}">
    <span class="at">${esc(clock(item.at))}</span>
    <span><span class="what">${esc(item.label)}</span>${item.detail?` <span class="detail">· ${esc(item.detail)}</span>`:''}${item.repeat>1?` <span class="detail">· attempt ${esc(item.repeat)}</span>`:''}</span></div>`).join('')+'</div>'
    +(d.timeline_omitted?`<p class="legend">${n(d.timeline_omitted)} events omitted from the middle of the interval.</p>`:'');
}

$('#content').innerHTML=`
<div class="ident">
  <div><span>Commit</span><b>${esc(c.commit.slice(0,10))}</b></div>
  <div><span>Parent</span><b>${esc(c.parent?c.parent.slice(0,10):'root commit')}</b></div>
  <div><span>Committed</span><b>${esc(when(c.date))}</b></div>
  <div><span>Duration</span><b>${esc(span(win?win.span_ms:null))}</b></div>
  <div><span>Proof</span><b class="${v.integrity_verified?'ok':'warn'}">${data.demo?'DEMO':v.integrity_verified?'VERIFIED':'UNVERIFIED'}</b></div>
  <div><span>Trace</span><b>${esc((c.trace_root||c.proof_hash).slice(0,8))}…${esc((c.trace_root||c.proof_hash).slice(-4))}</b></div>
</div>
<h1 class="title">${esc(c.title)}</h1>
<p class="lede">Everything recorded between the previous commit and this one: what the human asked, what the machine spent, which agents ran, and how much of the work survived into the tree. Quantities first; the derived score is further down.</p>
<div class="five">
  <div><span>Human input</span><b class="num">${short(tokens(m.human))}</b><small>tokens · ${n(m.human.messages||0)} prompts</small></div>
  <div><span>AI visible output</span><b class="num">${short(tokens(m.visible_ai))}</b><small>tokens · ${n(m.visible_ai.events||0)} messages</small></div>
  <div><span>Machine work</span><b class="num">${m.priced_calls?awc(m.reference_usd_known_subtotal):unknown}</b><small>AWC · ${n(modelCalls)} model calls</small></div>
  <div><span>Agent calls</span><b class="num">${n(agentCalls)}</b><small>tools, skills, sub-agents</small></div>
  <div><span>Artifact survival</span><b class="num">${e.artifact.operations?pct(ratio(e.artifact.retained,e.artifact.operations)):unknown}</b><small>${n(e.artifact.retained)} of ${n(e.artifact.operations)} edits</small></div>
</div>

<div class="section">
  <div class="section-head"><h2>Human</h2><span class="note">Observed</span></div>
  <div class="cols">
    ${box('Input',[kv('Prompt tokens',short(tokens(m.human)),true),kv('Turns',n(m.human.messages||0)),
      kv('Unique sessions',act?n(act.sessions):null),kv('Counting basis',m.human.tokens_complete===false?'partial capture':m.human.tokens_estimated?'includes estimates':'tokenizer counted')])}
    ${box('Attention cost',[kv('AI visible output',short(tokens(m.visible_ai)),true),kv('AI messages',n(m.visible_ai.events||0)),
      kv('Model output tokens',short(modelSum('output_tokens'))),
      kv('Share shown to the reader',modelSum('output_tokens')&&tokens(m.visible_ai)!==null?pct(ratio(tokens(m.visible_ai),modelSum('output_tokens')),1):null)])}
    ${box('Attribution [derived]',[kv('Prompts linked to edits',`${n(e.human.linked_prompts)} / ${n(e.human.prompts)}`,true),
      kv('Method',e.human.attribution),kv('Retained input weight',pct(ratio(Number(e.human.retained_weight),e.human.observed_weight),1)),
      kv('Intent analysis','not implemented')],'<p class="legend">Prompt-to-edit linkage is temporal, not semantic. Intent duplication and contradiction analysis are not implemented in this version.</p>')}
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Machine</h2><span class="note">Observed · reference price at list rates</span></div>
  <div class="cols">
    ${box('Totals',[kv('Total AI tokens',short(modelSum('input_tokens')===null||modelSum('output_tokens')===null?null:modelSum('input_tokens')+modelSum('output_tokens')),true),
      kv('Model calls',n(modelCalls)),kv('Input tokens',short(modelSum('input_tokens'))),kv('Of which cache reads',short(modelSum('cached_input_tokens'))),
      kv('Output tokens',short(modelSum('output_tokens'))),kv('Of which reasoning',short(modelSum('reasoning_tokens')))])}
    ${box('Cost',[kv('Reference compute',m.priced_calls?awc(m.reference_usd_known_subtotal)+' AWC':null,true),
      kv('Actual cost',m.actual_priced_calls?money(m.actual_usd_known_subtotal):null),
      kv('Priced calls',`${n(m.priced_calls)} / ${n((m.priced_calls||0)+(m.unpriced_calls||0))}`),
      kv('Basis','1 AWC = $1 at the recorded list price')],'<p class="legend">Reference compute uses the price snapshot stored with each call, so discounts, credits and reverse-engineered endpoints cannot move it. What was actually paid is recorded separately.</p>')}
    ${box('Work by model',[],modelMix())}
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Agent</h2><span class="note">Observed use, not installed inventory</span></div>
  <div class="cols two">
    ${box('Execution',[kv('Tools used',n((m.tools_used||[]).length),true),kv('Tool calls',n(counts['tool.call']||0)),
      kv('Tool results seen',n(d.tool_results)),kv('Failed results',act?n(act.failed_tool_calls):null),
      kv('Skills used',n((m.skills_used||[]).length)),kv('Skill activations',n(counts['skill.used']||0)),
      kv('MCP servers used',n((m.mcp_used||[]).length)),kv('MCP calls [derived]',n(d.mcp_calls)),
      kv('Sub-agents',n(counts['agent.spawn']||0)),kv('Max depth',agent?n(agent.max_depth):null)])}
    ${box('Execution graph',[],tree())}
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Artifact</h2><span class="note">Derived from the trace and the committed tree</span></div>
  <div class="cols">
    ${box('Work',[kv('Files touched',n(d.files_total),true),kv('File write events',n(d.files.reduce((t,f)=>t+f.writes,0))),
      kv('Semantic edits',n(e.artifact.operations)),kv('Surviving edits',n(e.artifact.retained)),
      kv('Artifact survival',e.artifact.operations?pct(ratio(e.artifact.retained,e.artifact.operations)):null),
      kv('Rework',e.artifact.operations?pct(1-ratio(e.artifact.retained,e.artifact.operations)):null)])}
    ${box('Most reworked',[reworked()].flat())}
    ${box('Capture',[kv('Checked against the tree',`${n(e.artifact.checked_operations)} edits`,true),
      kv('Committed units / files',`${n(e.scope.units)} / ${n(e.scope.files)}`),
      kv('Coverage gaps',act?n(act.coverage_gaps):n(e.gaps)),
      kv('Limits',e.limited?'bounded by capture limits':'complete for observed files')],
      '<p class="legend">A semantic edit is one structural unit added or removed: top-level AST nodes for Python, eight-line blocks elsewhere. Moving code inside a file produces no edit.</p>')}
  </div>
  <div style="margin-top:2px" class="cols two">
    ${box('Per file',[],files())}
    ${box('Derived retention score',[],`<div class="derived-score"><div><span>${esc(s.algorithm)}</span><b class="num">${esc(s.value)} <small style="font:11px var(--mono);color:var(--dim)">/ 100 · ${esc(s.grade)}</small></b></div>
      <div class="dims">${Object.values(s.components).map(cmp=>`${esc(cmp.label)} ${cmp.ratio===null?'—':pct(cmp.ratio,0)} <span style="color:var(--dim)">(w ${Math.round(Number(cmp.effective_weight??cmp.weight)*100)}%)</span>`).join('<br>')}</div></div>
      <p class="legend">Derived, versioned and recomputable, but still a policy on top of the facts above: retention only, ${esc(s.status)} evidence at ${pct(s.confidence,0)}. It is deliberately not the headline of this page.</p>`)}
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Timeline</h2><span class="note">Sessions, declared tasks and rework, in recorded order</span></div>
  ${timeline()}
</div>

<div class="section">
  <div class="section-head"><h2>Result</h2><span class="note">Evidence, not proof of work</span></div>
  <div class="cols">
    ${box('Commit contents',[kv('Files added',d.result?n(d.result.added):null,true),kv('Files modified',d.result?n(d.result.modified):null),
      kv('Files removed',d.result?n(d.result.removed):null),kv('Files renamed',d.result?n(d.result.renamed):null),
      kv('Lines',data.diff?`+${n(data.diff.insertions)} / −${n(data.diff.deletions)}`:null)])}
    ${box('Declared tasks',[kv('Declared',n(e.task.declared),true),kv('Completed with evidence',n(e.task.completed)),
      kv('Attempts',n(e.task.attempts)),kv('Re-opened',e.task.declared?n(e.task.attempts-e.task.declared):null),
      kv('Basis',e.task.basis)])}
    ${box('Not recorded',[kv('Build','—'),kv('Tests','—'),kv('Lint','—'),
      kv('Test files touched [derived]',d.result?n(d.result.tests):null)],
      '<p class="legend">Build, test and lint outcomes are not observed by this version. Until an adapter reports them, a high score says nothing about whether the code works.</p>')}
  </div>
</div>

<div class="section">
  <div class="section-head"><h2>Verification</h2><span class="note">${data.demo?'Demonstration data':v.integrity_verified?'Recomputed from the trace and Git':'Not checked'}</span></div>
  <div class="cols">
    ${box('Checks',[kv('Trace hash chain',v.integrity_verified?'✓':'—'),kv('Git parent',v.git_tree_verified?'✓':'—'),
      kv('Git tree',v.git_tree_verified?'✓':'—'),kv('Model usage records',v.integrity_verified?'✓':'—'),
      kv('Artifact trace',v.integrity_verified?'✓':'—'),kv('Events in interval',n(v.events))])}
    ${box('Identity',[kv('Proof hash',c.proof_hash.slice(0,24)+'…'),kv('Tree',c.tree?c.tree.slice(0,16)+'…':null),
      kv('Boundary',c.boundary),kv('Score algorithm',s.algorithm),kv('Accounting',m.algorithm||'observed-v1'),kv('Trust',v.trust)])}
    ${box('Not attested',[kv('Execution authenticity','no'),kv('Completeness','no'),kv('Result quality','no'),kv('Ranking eligible','no')],
      '<p class="legend">Hashes prove the record is internally consistent and bound to this commit. They cannot prove that the recorder saw everything, or that the work was done the way it is described.</p>')}
  </div>
  <div class="prov" style="margin-top:2px">
    <div><h4>Observed</h4><ul><li>Human prompt tokens and turns</li><li>AI visible output</li><li>Model calls and token buckets</li><li>Tool, skill and sub-agent events</li><li>File write observations</li><li>Timestamps of recorded events</li></ul><p>Written by a local recorder as the work happened.</p></div>
    <div><h4>Derived</h4><ul><li>Reference compute (AWC)</li><li>Semantic edits and survival</li><li>Per-file rework and reintroduction</li><li>Commit contents from Git</li><li>Retention score</li></ul><p>Recomputed from observed data and the Git objects; reproducible.</p></div>
    <div><h4>Inferred</h4><ul><li>Prompt-to-edit attribution</li><li>Task equivalence and churn</li><li>Intent graph <em>(not implemented)</em></li></ul><p>Estimates. They carry lower confidence and must not be read as measurements.</p></div>
  </div>
</div>`;

document.getElementById('print').addEventListener('click',()=>window.print());</script></body></html>
